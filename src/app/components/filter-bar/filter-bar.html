<div class="filter-bar">
  <input
    class="input"
    type="text"
    id="filter-bar-input"
    placeholder="Search recipes..."
    [(ngModel)]="searchInput"
    (ngModelChange)="onSearchChange()"
  >
  <select
    class="select select-diff"
    id="difficulty"
    [(ngModel)]="selectedDifficulty"
    (ngModelChange)="onDifficultyChange()"
  >
    <option
      class="option"
      *ngFor="let difficulty of difficulties"
      [value]="difficulty"
    >
      {{difficulty}}
    </option>
  </select>
  <select
    class="select select-time"
    id="cook-time"
    [(ngModel)]="selectedCookTime"
    (ngModelChange)="onCookTimeChange()"
  >
    <option
      class="option"
      *ngFor="let cookTime of cookTimes"
      [value]="cookTime"
    >
      {{cookTime}}
    </option>
  </select>
</div>
